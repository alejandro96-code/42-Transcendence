[project]
name = "social-api-tests"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "faker>=40.37.0",
    "httpx>=0.28.1",
    "pydantic>=2.13.4",
    "pytest>=9.1.1",
    "pytest-bdd>=8.1.0",
    "python-dotenv>=1.2.3",
]


[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["*_steps.py", "test_*.py"]
addopts = "-v"