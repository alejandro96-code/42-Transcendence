services:

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile

    container_name: transcendence-nginx

    ports:
      - "${SERVER_IP}:8443:8443"

    volumes:
      - ./nginx/certs:/etc/nginx/certs:ro

    environment:
      - SERVER_IP=${SERVER_IP}

    depends_on:
      - frontend
      - backend

    networks:
      - transcendence-network


  frontend:
    build:
      context: .
      dockerfile: ./frontend/Dockerfile

    container_name: transcendence-frontend

    expose:
      - "3000"

    volumes:
      - .:/app
      - /app/node_modules

    environment:
      - NODE_ENV=development
      - SERVER_IP=${SERVER_IP}
      - VITE_SERVER_IP=${SERVER_IP}
      - VITE_API_URL=https://${SERVER_IP}:8443

    stdin_open: true
    tty: true

    networks:
      - transcendence-network


  backend:
    build:
      context: .
      dockerfile: ./backend/Dockerfile

    container_name: transcendence-backend

    expose:
      - "4000"

    volumes:
      - .:/app
      - /app/node_modules

    env_file:
      - ./backend/.env

    environment:
      - NODE_ENV=development
      - SERVER_IP=${SERVER_IP}
      - FRONTEND_URL=https://${SERVER_IP}:8443
      - FORTYTWO_CALLBACK_URL=https://${SERVER_IP}:8443/api/auth/42/callback
      - DB_HOST=postgres

    stdin_open: true
    tty: true

    networks:
      - transcendence-network


networks:
  transcendence-network:
    external: false
    name: transcendence-network