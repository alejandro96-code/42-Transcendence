services:
  postgres:
    image: postgres:16-alpine
    container_name: transcendence-postgres
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD en el archivo de entorno}
      POSTGRES_DB: ${DB_NAME:-transcendence}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/init.sql:/docker-entrypoint-initdb.d/init.sql
    restart: unless-stopped
    networks:
      - transcendence-network

  adminer:
    image: adminer:latest
    container_name: transcendence-adminer
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    restart: unless-stopped
    networks:
      - transcendence-network
    depends_on:
      - postgres

volumes:
  postgres_data:

networks:
  transcendence-network:
    external: false
    name: transcendence-network